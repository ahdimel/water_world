    notes: "Take-or-pay minimum under a 30-year agreement."

  desal.huntington_beach.capex_proposed:
    id: desal.huntington_beach.capex_proposed
    value: 1400000000.0
    units: USD
    year: 2022
    confidence: medium
    citations: [enr_hb, calmatters_hb]
    notes: "Proposed; unanimously rejected by the Coastal Commission in May 2022."

  desal.huntington_beach.capacity_proposed:
    id: desal.huntington_beach.capacity_proposed
    value: 189270.0
    units: m3/day
    confidence: high
    citations: [enr_hb]
    notes: "50 MGD, same nameplate as Carlsbad."

  desal.doheny.capex:
    id: desal.doheny.capex
    value: 140000000.0
    units: USD
    confidence: medium
    citations: [scwd_doheny]

  desal.doheny.capacity:
    id: desal.doheny.capacity
    value: 18927.0
    units: m3/day
    confidence: high
    citations: [scwd_doheny]
    notes: "5 MGD = 5,600 AF/yr. First fully Ocean-Plan-compliant plant, subsurface intake."

  # ------------------------------------------------------------------ energy
  swro.sec:
    id: swro.sec
    value: 3.25
    units: kWh/m3
    low: 2.5
    high: 4.0
    confidence: high
    citations: [swro_energy_review, membranes_sec]
    notes: "Typical large-scale SWRO specific energy consumption, with energy recovery."

  swro.sec_thermodynamic_min:
    id: swro.sec_thermodynamic_min
    value: 1.6
    units: kWh/m3
    low: 0.79
    high: 1.6
    confidence: medium
    citations: [membranes_sec]
    notes: >
      Sources differ on the framing: ~1.6 kWh/m3 for 35 g/L at 50% recovery, ~0.79 for
      the idealised minimum. The gap to practice is only ~2x, which is why energy is
      not a large enough cost term to carry the flexibility thesis alone.

  # ------------------------------------------------------------------ flexibility question
  flex.brackish.saving_rtp:
    id: flex.brackish.saving_rtp
    value: 0.161
    units: fraction
    confidence: medium
    citations: [flex_brackish]
    notes: "LCOW reduction under aggressive real-time pricing. Brackish, not seawater."

  flex.brackish.saving_designed_for_flex:
    id: flex.brackish.saving_designed_for_flex
    value: 0.47
    units: fraction
    confidence: medium
    citations: [flex_brackish]
    notes: >
      With larger feed pumps and lower minimum flow rates. Brackish is less
      capex-intensive per m3 than seawater, so this is probably an OPTIMISTIC bound
      for SWRO. Replacing it with an SWRO-specific figure is the point of the Phase 2
      capacity-factor model.

  flex.storage.water_tank_per_m3:
    id: flex.storage.water_tank_per_m3
    value: 98.0
    units: USD/m3
    confidence: low
    citations: [nature_flex]
    notes: "Storage-medium comparison at 2 kWh/m3."

  flex.storage.battery_per_m3_equivalent:
    id: flex.storage.battery_per_m3_equivalent
    value: 600.0
    units: USD/m3
    confidence: low
    citations: [nature_flex]
    notes: >
      ~6x the tank cost per unit of energy shifted. Favours the flexibility thesis at
      the storage-medium boundary; the whole-system studies disagree because idling
      strands RO capex. See swro_deferrable for the opposing conclusion.

  # ------------------------------------------------------------------ economics
  econ.discount_rate:
    id: econ.discount_rate
    value: 0.07
    units: fraction
    low: 0.05
    high: 0.10
    confidence: low
    citations: [swro_energy_review]
    notes: "Working assumption for levelisation. Phase 2 should sensitivity-test."

  econ.capex_scaling_exponent:
    id: econ.capex_scaling_exponent
    value: 0.8
    units: dimensionless
    low: 0.75
