    low: 0.06
    high: 0.60
    confidence: derived
    derived_from:
      - permitting.ca.decisions_total
      - permitting.ca.decisions_denied
    notes: >
      1 of 4 = 25%. TREAT THE POINT VALUE AS ALMOST MEANINGLESS: n=4. The band shown is
      the 90% credible interval of a Beta(1+1, 3+1) posterior under a uniform prior,
      and the engine should SAMPLE that posterior rather than use 0.25. Reporting a
      point rejection probability off four observations would be exactly the kind of
      false precision this project is supposed to avoid.
      Also note the censoring problem: this counts only projects that survived long
      enough to reach a decision. DeepWater Desal withdrew, People's Moss Landing
      stalled, and West Basin and Camp Pendleton were shelved without ever getting a
      vote. The true failure rate for a project at PROPOSAL is materially higher than
      the denial rate at DECISION, and the two must not be used interchangeably.

