parameters:

  # ------------------------------------------------------------------ constants
  unit.acre_foot_m3:
    id: unit.acre_foot_m3
    value: 1233.48
    units: m3
    confidence: high
    citations: [unit_definition]
    notes: "1 acre-foot = 43,560 ft^3 = 1233.48 m^3. Used for every $/AF <-> $/m3 conversion."

  # ------------------------------------------------------------------ Act I: prices
  cpi.water_sewer_trash.pct_change_2000_2025:
    id: cpi.water_sewer_trash.pct_change_2000_2025
    value: 207.0
    units: percent
    confidence: high
    citations: [bls_cpi]
    notes: >
      Jan 2000 -> Dec 2025, series CUUR0000SEHG. VERIFIED against the primary BLS series
      in Phase 1, independently reproducing the secondary-source figure used in Phase 0.

  cpi.all_items.pct_change_2000_2025:
    id: cpi.all_items.pct_change_2000_2025
    value: 92.0
    units: percent
    confidence: high
    citations: [bls_cpi]
    notes: >
      Jan 2000 -> Dec 2025, series CUUR0000SA0. Phase 0's secondary source said 93%;
      the primary series gives 92%. Immaterial to the argument.

  cpi.water.real_pct_change_2000_2025:
    id: cpi.water.real_pct_change_2000_2025
    value: 60.0
    units: percent
    confidence: derived
    derived_from:
      - cpi.water_sewer_trash.pct_change_2000_2025
      - cpi.all_items.pct_change_2000_2025
    notes: >
      Household water/sewer/trash rose ~60% in real terms over the period. This is the
      number that falsifies the original "water has not kept pace with earnings" claim
      for residential users, and forces Act I to aim at the ag/urban divergence instead.

  rates.iid.agricultural:
    id: rates.iid.agricultural
    value: 20.0
    units: USD/acre-foot
    confidence: medium
    citations: [calmatters_rates, iid_water]
    notes: >
      IID charges farmers a conveyance-cost-only rate; the Colorado River water itself is
      free to the district under its rights. Reported as unchanged "for years" — the
      length of the nominal freeze is flagged for verification.

  rates.ca_ag_districts.average:
    id: rates.ca_ag_districts.average
    value: 30.0
    units: USD/acre-foot
    confidence: medium
    citations: [calmatters_rates]

  rates.ca_city_utilities.average:
    id: rates.ca_city_utilities.average
    value: 512.0
    units: USD/acre-foot
    confidence: medium
    citations: [calmatters_rates]
    notes: "~17x the agricultural district average. The core Act I disparity."

  # ------------------------------------------------------------------ Act II: alternatives
  fallowing.pvid.acres:
    id: fallowing.pvid.acres
    value: 26000.0
    units: acres
    confidence: medium
    citations: [mwd_pvid]
    notes: "~30% of farmland in the Palo Verde Valley, under the 2023 agreement."

  fallowing.pvid.conserved:
    id: fallowing.pvid.conserved
    value: 117000.0
    units: acre-feet/year
    confidence: medium
    citations: [mwd_pvid]

  fallowing.pvid.entry_payment:
    id: fallowing.pvid.entry_payment
    value: 3170.0
    units: USD/acre
    year: 2023
    confidence: medium
    citations: [mwd_pvid]
    notes: "One-time payment to enter the programme."

  fallowing.pvid.annual_payment:
    id: fallowing.pvid.annual_payment
    value: 800.0
    units: USD/acre/year
    year: 2023
    confidence: medium
    citations: [mwd_pvid]
    notes: "Escalating; 800 is the current level."

  fallowing.direct_cost:
    id: fallowing.direct_cost
    value: 280.0
    units: USD/acre-foot
    year: 2023
    low: 240.0
    high: 320.0
    confidence: derived
    derived_from:
      - fallowing.pvid.conserved
      - fallowing.pvid.acres
      - fallowing.pvid.entry_payment
      - fallowing.pvid.annual_payment
      - econ.discount_rate
    notes: >
      Annual payment (800/4.5 = ~178/AF) plus entry payment amortised over 10y at 7%
      (3170 * 0.1424 / 4.5 = ~100/AF). Excludes the Salton Sea externality entirely —
      see fallowing.social_cost for the figure that should be used in comparisons.

  # ------------------------------------------------------------------ Salton Sea externality
  salton.qsa_mitigation_cap:
    id: salton.qsa_mitigation_cap
    value: 133000000.0
    units: USD
    year: 2003
    confidence: high
    citations: [lao_salton, wef_qsa]
    notes: "Capped liability of IID, CVWD and SDCWA. California is the backstop beyond it."

  salton.qsa_cap_with_interest:
    id: salton.qsa_cap_with_interest
    value: 288000000.0
    units: USD
    confidence: medium
    citations: [lao_salton]

  salton.phase1_cost:
    id: salton.phase1_cost
    value: 420000000.0
    units: USD
    year: 2018
    confidence: high
    citations: [lao_salton]
    notes: "Ten-year management plan, 2018-2028."

  salton.playa_projected:
    id: salton.playa_projected
    value: 48300.0
    units: acres
    confidence: high
    citations: [lao_salton]
    notes: "Projected exposure over the Phase I decade."

  salton.playa_covered:
    id: salton.playa_covered
    value: 29800.0
    units: acres
    confidence: high
    citations: [lao_salton]
    notes: "Planned project coverage — ~62% of projected exposure."

  salton.om_annual:
    id: salton.om_annual
    value: 9000000.0
    units: USD/year
    year: 2018
    low: 8000000.0
    high: 10000000.0
    confidence: high
    citations: [lao_salton]
    notes: "Ongoing operations and maintenance after Phase I."

  salton.qsa_transfer_volume:
    id: salton.qsa_transfer_volume
    value: 303000.0
    units: acre-feet/year
    confidence: medium
    citations: [qsa_factsheet, wef_qsa, lao_salton]
    notes: >
      IID->SDCWA 200,000 AF/yr plus IID->CVWD 103,000 AF/yr. Matches the LAO's
      "approximately 300,000 acre-feet" of transfers expediting playa exposure.

  salton.externality:
    id: salton.externality
    value: 197.0
    units: USD/acre-foot
    year: 2018
    low: 140.0
    high: 255.0
    confidence: derived
    derived_from:
      - salton.phase1_cost
      - salton.playa_projected
      - salton.playa_covered
      - salton.om_annual
      - salton.qsa_transfer_volume
    notes: >
      LOAD-BEARING AND CONTESTED. Low end = Phase I as planned (62% coverage):
      420M/10yr / 303k AF = ~139/AF. High end = extrapolated to full coverage
      (420M/0.62 = 677M) plus O&M = ~255/AF. Assumes all QSA transfer drives playa
      exposure and all restoration spend is dust-driven; neither is strictly true.
      IID shifted from fallowing to efficiency measures around 2012, and some exposure
      would have occurred regardless. Sensitivity-test before this carries a conclusion.

  fallowing.social_cost:
    id: fallowing.social_cost
    value: 477.0
    units: USD/acre-foot
    low: 380.0
    high: 575.0
    confidence: derived
    derived_from:
      - fallowing.direct_cost
      - salton.externality
    notes: >
      Direct cost plus the socialised dust externality. This is the figure that overlaps
      with Sorek-cost desalination and collapses reallocation's apparent 12x advantage
      to roughly parity against *reformed* desal.
      BAND CORRECTED in Phase 1: the Phase 0.5 write-up quoted 420-535, which added the
      externality's range to the direct cost's POINT value. Propagating both uncertainties
      gives 380-575. The overlap conclusion is unaffected — Sorek B at ~$505/AF still sits
      inside the band, and more comfortably than before.

