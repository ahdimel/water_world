  # ------------------------------------------------------------- the rival hypothesis
  construction.us_admin_premium:
    id: construction.us_admin_premium
    value: 2.0
    units: dimensionless
    low: 1.3
    high: 3.0
    confidence: low
    citations: [urban_institute_infra, construction_physics_costs]
    notes: >
      RIVAL HYPOTHESIS #2 — and the most methodologically dangerous parameter here,
      because it is NOT independent of the institutional explanation.
      The US builds administratively-heavy infrastructure at a large multiple of peer
      countries (Urban Institute: ~3x per mile on some transport infrastructure;
      Construction Physics: US costs exceed everywhere outside Switzerland and Hong Kong
      for administration-heavy project types, while US LOW-oversight construction is
      internationally competitive).
      The critical point: that literature attributes the premium primarily to
      administrative overhead, procurement practice, non-standard design and low
      resulting labour efficiency — NOT to wages or materials. Those are the same
      mechanisms Act III attributes to permitting.
      CONSEQUENCE FOR THE MODEL: do not subtract this as an independent rival term and
      claim the remainder for permitting. That double-counts and would overstate the
      case. The defensible output is a COMBINED institutional residual, with an explicit
      statement that the split between "permitting duration/risk" and "general US
      administrative construction premium" is NOT IDENTIFIED by our data.
