  desal.huntington_beach.capex_proposed:
    id: desal.huntington_beach.capex_proposed
    value: 1400000000.0
    units: USD
    year: 2022
    confidence: medium
    citations: [enr_hb, calmatters_hb]
    notes: "Proposed; unanimously rejected by the Coastal Commission in May 2022."

  desal.huntington_beach.capacity_proposed:
    id: desal.huntington_beach.capacity_proposed
    value: 189270.0
    units: m3/day
