# water_world — curated literature parameters
#
# Every number in this project that came from a document rather than a feed lives here,
# with a citation and, wherever possible, an uncertainty range. Phase 2 samples these
# directly, so a missing range is an assertion of certainty — avoid it.
#
# confidence:
#   high    - primary source: official filing, dataset, or statute
#   medium  - reputable secondary reporting, or consistent across independent sources
#   low     - single secondary source, or contested
#   derived - our own arithmetic; must list derived_from
#
# COMMITTED to git, unlike data/raw. This file is evidence, not cache.

